<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RPA + MFA 控制台</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
      margin: 0; background: #f4f6fb; color: #1f2937;
    }
    .wrap { max-width: 720px; margin: 40px auto; padding: 0 16px; }
    .card {
      background: #fff; border-radius: 12px; padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06); margin-bottom: 20px;
    }
    h1 { font-size: 20px; margin: 0 0 20px; }
    label { display: block; font-size: 13px; color: #6b7280; margin: 12px 0 4px; }
    input, select {
      width: 100%; padding: 10px 12px; border: 1px solid #d1d5db;
      border-radius: 8px; font-size: 14px;
    }
    button {
      margin-top: 16px; padding: 10px 20px; border: none; border-radius: 8px;
      background: #4f46e5; color: #fff; font-size: 14px; cursor: pointer;
    }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }
    button.secondary { background: #059669; }
    .hidden { display: none; }
    .status { font-size: 13px; padding: 6px 12px; border-radius: 999px; display: inline-block; }
    .status.running { background: #dbeafe; color: #1d4ed8; }
    .status.waiting_code, .status.waiting_email { background: #fef3c7; color: #b45309; }
    .status.done { background: #d1fae5; color: #047857; }
    .status.error { background: #fee2e2; color: #b91c1c; }
    #log {
      background: #0b1021; color: #d1d5db; font-family: monospace; font-size: 12px;
      border-radius: 8px; padding: 14px; height: 260px; overflow-y: auto;
      white-space: pre-wrap; line-height: 1.6;
    }
    .mfa-box { border: 2px dashed #f59e0b; background: #fffbeb; }
    .row { display: flex; gap: 10px; }
    .row input { flex: 1; }
    .row button { margin-top: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>RPA 自动化控制台（MFA）</h1>

      <label>目标站点</label>
      <select id="site"></select>

      <button id="startBtn">开始执行 RPA</button>
      <span id="status" class="status hidden"></span>
    </div>

    <!-- 登录邮箱输入区，收到 NEED_EMAIL 才显示 -->
    <div id="emailCard" class="card mfa-box hidden">
      <h1>请输入登录邮箱</h1>
      <div class="row">
        <input id="email" type="email" placeholder="someone@example.com" />
        <button id="submitEmailBtn" class="secondary">提交邮箱</button>
      </div>
    </div>

    <!-- 短信验证码输入区，收到 NEED_SMS_CODE 才显示 -->
    <div id="mfaCard" class="card mfa-box hidden">
      <h1>请输入短信验证码</h1>
      <div id="mfaHint" class="hidden" style="color:#b91c1c;font-size:13px;margin-bottom:8px;"></div>
      <div class="row">
        <input id="smsCode" placeholder="6 位验证码" inputmode="numeric" />
        <button id="submitCodeBtn" class="secondary">提交验证码</button>
      </div>
    </div>

    <div class="card">
      <h1>执行日志</h1>
      <div id="log"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
